name: Auto-update Powerball data

# Powerball draws Mon/Wed/Sat at 22:59 ET (≈ 02:59 / 03:59 UTC next day depending on DST).
# Run ~1 hour after each draw to be safe — NY Open Data publishes within minutes
# but we add buffer for delays. GitHub cron uses UTC and may have a ~15-30 min jitter.
on:
  schedule:
    - cron: '30 4 * * 2,4,0'      # Tue / Thu / Sun at 04:30 UTC (after Mon/Wed/Sat draws)
    - cron: '30 12 * * 2,4,0'     # Backup run at 12:30 UTC same day, in case the first failed
  workflow_dispatch:               # Allow manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update_data.py
        run: |
          python3 update_data.py
          echo "----- After update -----"
          ls -la app/index.html data/powerball_history.json
          head -c 200 data/analytics.json

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "✓ No new draws — repo already up to date."
            exit 0
          fi
          # Extract last draw date for the commit message
          LAST_DATE=$(python3 -c "import json; d=json.load(open('data/powerball_history.json')); print(d[-1]['date'])")
          N=$(python3 -c "import json; d=json.load(open('data/powerball_history.json')); print(len(d))")
          git commit -m "Auto-update: draw $LAST_DATE (N=$N) [skip ci]"
          git push
          echo "✓ Pushed update for draw $LAST_DATE"
