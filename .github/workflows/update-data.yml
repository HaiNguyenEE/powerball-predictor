name: Auto-update Powerball data

# Powerball draws Mon/Wed/Sat at 22:59 ET. NY Open Data publishes anywhere
# from minutes to a few hours later. GitHub Actions cron jitter can add
# another 15-180 min. So we schedule 5 attempts spaced through the day.
on:
  schedule:
    - cron: '30 4 * * 2,4,0'      # Tue / Thu / Sun  04:30 UTC  (~draw + 1h)
    - cron: '30 6 * * 2,4,0'      # Tue / Thu / Sun  06:30 UTC  (+2h)
    - cron: '30 9 * * 2,4,0'      # Tue / Thu / Sun  09:30 UTC  (+5h)
    - cron: '30 12 * * 2,4,0'     # Tue / Thu / Sun  12:30 UTC  (+8h)
    - cron: '30 16 * * 2,4,0'     # Tue / Thu / Sun  16:30 UTC  (+12h, last attempt)
    # Idempotent — once a draw is committed, subsequent attempts no-op.
  workflow_dispatch:               # Allow manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update_data.py
        run: |
          python3 update_data.py
          echo "----- After update -----"
          ls -la app/index.html data/powerball_history.json
          head -c 200 data/analytics.json

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "✓ No new draws — repo already up to date."
            exit 0
          fi
          # Belt-and-braces pin for the bug fixed in update_data.py: a run that
          # adds no draw must leave NO commit behind. Five scheduled attempts a
          # day used to produce five byte-identical commits whose only content
          # was the generatedAt stamp moving, and five Pages builds with it.
          # Refuse to commit when no other file changed AND app/index.html is
          # identical to HEAD once that one stamp is normalized away. A real
          # change — new draw, edited template.html, edited analytics — differs
          # somewhere else and still commits normally.
          if git diff --staged --quiet -- ':!app/index.html' \
             && git show HEAD:app/index.html \
                | sed -E 's/"generatedAt":"[^"]*"/"generatedAt":"@"/' \
                | cmp -s - <(sed -E 's/"generatedAt":"[^"]*"/"generatedAt":"@"/' app/index.html); then
            echo "✓ Only the generatedAt stamp moved — nothing to commit."
            git reset --quiet
            git checkout -- .
            exit 0
          fi
          LAST_DATE=$(python3 -c "import json; d=json.load(open('data/powerball_history.json')); print(d[-1]['date'])")
          N=$(python3 -c "import json; d=json.load(open('data/powerball_history.json')); print(len(d))")
          git commit -m "Auto-update: draw $LAST_DATE (N=$N) [skip ci]"
          git push
          echo "✓ Pushed update for draw $LAST_DATE"
